<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主神也加班 · 无限流文字游戏</title>
<style>
  :root{
    --ink:#e8e2d0;
    --ink-dim:#9a9484;
    --gold:#d8c487;
    --cyan:#8fd0d8;
    --red:#ff5a4a;
    --panel:rgba(8,11,22,.72);
    --line:rgba(216,196,135,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;height:100dvh}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    background:#04060f;
    color:var(--ink);
    overflow:hidden;
  }
  #stars{position:fixed;inset:0;z-index:0}
  .nebula{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(900px 600px at 78% 12%,rgba(70,90,170,.20),transparent 60%),
      radial-gradient(700px 500px at 12% 88%,rgba(120,70,150,.14),transparent 60%),
      radial-gradient(1200px 800px at 50% 50%,rgba(10,14,30,.1),transparent 70%);
  }
  /* 电影感暗角与顶部压暗 */
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 92% at 50% 42%,transparent 52%,rgba(2,3,8,.55) 100%);
    box-shadow:inset 0 0 140px rgba(0,0,0,.55)}
  .vignette::after{content:"";position:absolute;left:0;right:0;top:0;height:44px;
    background:linear-gradient(180deg,rgba(2,3,8,.65),transparent)}

  /* —— 副本氛围色：随剧情场景切换 —— */
  body[data-scene="tv"] .nebula{background:
    radial-gradient(900px 600px at 78% 12%,rgba(95,115,200,.26),transparent 60%),
    radial-gradient(700px 500px at 12% 88%,rgba(90,60,150,.16),transparent 60%)}
  body[data-scene="hospital"] .nebula{background:
    radial-gradient(900px 600px at 78% 12%,rgba(46,140,132,.22),transparent 60%),
    radial-gradient(700px 500px at 12% 88%,rgba(26,96,120,.16),transparent 60%)}
  body[data-scene="mall"] .nebula{background:
    radial-gradient(900px 600px at 78% 12%,rgba(196,152,66,.22),transparent 60%),
    radial-gradient(700px 500px at 12% 88%,rgba(150,84,142,.16),transparent 60%)}
  body[data-scene="meeting"] .nebula{background:
    radial-gradient(900px 600px at 78% 12%,rgba(122,152,204,.2),transparent 60%),
    radial-gradient(700px 500px at 12% 88%,rgba(82,92,152,.15),transparent 60%)}
  body[data-scene^="end_"] .nebula{background:
    radial-gradient(900px 600px at 78% 12%,rgba(216,168,88,.2),transparent 60%),
    radial-gradient(700px 500px at 50% 58%,rgba(122,92,164,.17),transparent 62%)}

  /* —— 场景缓慢运镜（Ken Burns）—— */
  .scene-inner{position:absolute;inset:0;will-change:transform;
    animation:kenburns 30s ease-in-out 1.2s infinite alternate}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.05) translateY(-8px)}}

  /* —— 文本面板装饰 —— */
  .paper::before{content:"";position:absolute;top:8px;left:8px;width:18px;height:18px;
    border-top:1px solid var(--line);border-left:1px solid var(--line);opacity:.85}
  .paper::after{content:"";position:absolute;bottom:8px;right:8px;width:18px;height:18px;
    border-bottom:1px solid var(--line);border-right:1px solid var(--line);opacity:.85}
  .node-chapter{display:inline-block;border:1px solid rgba(143,208,216,.35);background:rgba(143,208,216,.06);
    padding:3px 12px;border-radius:20px}
  .node-title::after{content:"";display:block;width:56px;height:1px;margin-top:10px;
    background:linear-gradient(90deg,var(--gold),transparent)}

  /* —— 选项增强 —— */
  .choice::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-56%);
    color:var(--gold);opacity:0;transition:.22s;font-size:18px;line-height:1}
  .choice:hover::after{opacity:.9}
  .choice:active{transform:scale(.985)}
  .choice.picked{background:rgba(216,196,135,.15);border-color:var(--gold);
    box-shadow:0 0 22px rgba(216,196,135,.25)}

  /* —— 属性点亮与提示 —— */
  @keyframes dotPop{0%{transform:scale(.2);opacity:.3}70%{transform:scale(1.4)}100%{transform:scale(1)}}
  .stat i.on{animation:dotPop .35s ease}
  .continue-hint{animation:hintPulse 1.8s ease-in-out infinite}
  @keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* —— 章节过场动效 —— */
  .veil-c{animation:veilTrack 1.6s ease both}
  @keyframes veilTrack{from{letter-spacing:.85em;opacity:0}35%{opacity:1}to{letter-spacing:.5em}}
  .veil-line{animation:ruleGrow 1.5s .25s ease both}
  .veil-s{animation:fadeUp 1s .45s ease both}

  /* —— 结局徽章流光 —— */
  .end-tag{position:relative;overflow:hidden}
  .end-tag::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,244,210,.32),transparent);
    animation:sheen 3.2s ease-in-out infinite}
  @keyframes sheen{0%{left:-60%}55%,100%{left:135%}}

  /* —— HUD 场景标签 —— */
  .hud-left{display:flex;align-items:center;gap:12px}
  .scene-chip{font-size:11.5px;letter-spacing:.25em;color:var(--ink-dim);
    border:1px solid rgba(255,255,255,.14);padding:4px 12px;border-radius:20px;
    background:rgba(255,255,255,.03)}

  .screen{position:relative;z-index:2;height:100%;display:none;flex-direction:column}
  .screen.active{display:flex}

  /* ---------- 标题屏 ---------- */
  #title-screen{align-items:center;justify-content:center;text-align:center;padding:24px}
  .title-main{
    font-size:clamp(48px,9vw,92px);
    letter-spacing:.3em;
    text-indent:.3em;
    color:var(--gold);
    text-shadow:0 0 40px rgba(216,196,135,.35),0 0 4px rgba(255,240,200,.5);
    font-weight:700;
  }
  .title-sub{
    margin-top:18px;font-size:15px;letter-spacing:.5em;text-indent:.5em;color:var(--ink-dim);
  }
  .title-rule{width:220px;height:1px;margin:34px auto;background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .title-desc{max-width:580px;margin:0 auto 40px;line-height:2;color:var(--ink-dim);font-size:14.5px}
  .menu{display:flex;flex-direction:column;gap:14px;align-items:center}
  .menu button{
    width:220px;padding:12px 0;background:transparent;color:var(--ink);
    border:1px solid var(--line);letter-spacing:.4em;text-indent:.4em;font-size:15px;
    cursor:pointer;font-family:inherit;transition:.25s;border-radius:2px;
  }
  .menu button:hover{background:rgba(216,196,135,.1);border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px rgba(216,196,135,.15)}
  .menu button:disabled{opacity:.3;cursor:not-allowed}
  #btn-respawn:not(:disabled){color:var(--red);border-color:var(--red);animation:pulseRed 2s infinite}
  @keyframes pulseRed{0%,100%{box-shadow:0 0 6px rgba(255,90,74,.2)}50%{box-shadow:0 0 18px rgba(255,90,74,.5)}}
  .title-foot{position:absolute;bottom:18px;font-size:12px;color:#5b574c;letter-spacing:.2em}

  /* ---------- 回廊 ---------- */
  #gallery{
    position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    background:rgba(3,5,12,.86);backdrop-filter:blur(6px);padding:30px;
  }
  #gallery.show{display:flex}
  .gallery-box{width:min(680px,94vw);max-height:86vh;overflow:auto;border:1px solid var(--line);background:rgba(10,14,28,.92);padding:34px 38px;border-radius:4px}
  .gallery-box h2{text-align:center;color:var(--gold);letter-spacing:.4em;font-weight:500;margin-bottom:6px}
  .gallery-box .tip{text-align:center;color:var(--ink-dim);font-size:12.5px;margin-bottom:24px;letter-spacing:.15em}
  .ending-card{border:1px solid rgba(255,255,255,.08);padding:16px 18px;margin-bottom:12px;border-radius:3px;line-height:1.9}
  .ending-card.locked{opacity:.42}
  .ending-card .et{color:var(--cyan);letter-spacing:.2em;font-size:14px}
  .ending-card .ed{color:var(--ink-dim);font-size:13px;margin-top:4px}
  .gallery-close{display:block;margin:18px auto 0;background:none;border:1px solid var(--line);color:var(--ink);padding:9px 34px;cursor:pointer;font-family:inherit;letter-spacing:.3em;border-radius:2px}
  .gallery-close:hover{color:var(--gold);border-color:var(--gold)}

  /* ---------- 成就系统 ---------- */
  #achv-toast{
    position:fixed;top:0;left:50%;transform:translate(-50%,-120%);z-index:60;
    display:flex;align-items:center;gap:12px;padding:12px 26px;
    background:rgba(10,14,28,.95);border:1px solid var(--gold);border-top:none;
    color:var(--ink);font-size:13.5px;letter-spacing:.14em;border-radius:0 0 4px 4px;
    box-shadow:0 6px 24px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
    pointer-events:none;white-space:nowrap;
  }
  #achv-toast.show{transform:translate(-50%,0)}
  #achv-toast .medal{color:var(--gold);font-size:17px}
  #achv-toast .t-name{color:var(--gold)}
  #achv-toast .t-sub{color:var(--ink-dim);font-size:11.5px;display:block;letter-spacing:.22em;margin-top:2px}
  .ending-card.achv-done{border-color:rgba(212,175,55,.4)}
  .ending-card.achv-done .et{color:var(--gold)}
  .achv-prog{position:fixed;top:14px;right:16px;z-index:8;font-size:11.5px;color:var(--ink-dim);letter-spacing:.25em;
    background:rgba(4,6,15,.4);border:1px solid rgba(255,255,255,.08);padding:6px 14px;border-radius:2px;backdrop-filter:blur(6px)}
  .achv-prog b{color:var(--gold);font-weight:normal}

  /* ---------- 游戏屏 ---------- */
  #game-screen{padding:0 0 40px}
  .hud{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 30px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;
    background:rgba(4,6,15,.38);backdrop-filter:blur(8px);
  }
  .hud .chapter{color:var(--gold);letter-spacing:.3em}
  .stats{display:flex;gap:22px}
  .stat{display:flex;align-items:center;gap:8px;color:var(--ink-dim);letter-spacing:.2em}
  .stat .dots{display:flex;gap:4px}
  .stat i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14);display:block;transition:.3s}
  .stat.calm i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .stat.talk i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .stat.slacker i.on{background:#c9a86a;box-shadow:0 0 8px #c9a86a}
  .hud-btns button{
    background:none;border:none;color:var(--ink-dim);cursor:pointer;font-family:inherit;
    font-size:12.5px;letter-spacing:.2em;margin-left:16px;
  }
  .hud-btns button:hover{color:var(--gold)}

  .hud{flex-shrink:0}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px 20px;overflow:hidden}
  .paper{
    position:relative;
    width:min(900px,94vw);height:82vh;height:82dvh;max-height:100%;min-height:0;
    display:flex;flex-direction:column;overflow:hidden;
    background:rgba(7,10,21,.82);
    border:1px solid rgba(216,196,135,.18);
    border-radius:6px;
    padding:0;
    box-shadow:0 -12px 50px rgba(0,0,0,.5),0 0 60px rgba(0,0,0,.55),inset 0 0 80px rgba(60,80,140,.06);
  }
  .story-scroll{flex:1;min-height:0;overflow-y:auto;padding:26px 44px 20px;outline-offset:-4px}
  .story-footer{flex-shrink:0;max-height:58%;overflow-y:auto;padding:16px 44px 22px;
    border-top:1px solid var(--line);background:rgba(7,10,21,.94)}
  .story-scroll,.story-footer{overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(216,196,135,.3) transparent}
  .story-scroll::-webkit-scrollbar,.story-footer::-webkit-scrollbar{width:6px}
  .story-scroll::-webkit-scrollbar-thumb,.story-footer::-webkit-scrollbar-thumb{background:rgba(216,196,135,.25);border-radius:3px}
  .footer-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .footer-heading .node-title{font-size:20px;margin-bottom:0}
  .footer-heading .node-title::after{margin-top:6px}
  .footer-heading .continue-hint{margin-top:0;flex-shrink:0}
  .node-chapter{color:var(--cyan);font-size:12.5px;letter-spacing:.4em;margin-bottom:8px}
  .node-title{font-size:23px;letter-spacing:.18em;color:var(--gold);font-weight:600;margin-bottom:14px;text-shadow:0 0 18px rgba(216,196,135,.25)}
  .node-text{font-size:16.5px;line-height:2;white-space:pre-wrap;color:var(--ink)}
  .node-text .cursor{display:inline-block;width:8px;height:1em;background:var(--gold);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .continue-hint{text-align:right;color:var(--ink-dim);font-size:12.5px;margin-top:14px;letter-spacing:.25em;min-height:18px}

  .choices{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .choices>.end-actions{grid-column:1/-1;margin-top:4px}
  .choices:empty{display:none}
  .choice{
    text-align:left;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.1);
    color:var(--ink);padding:11px 20px;font-size:15.5px;line-height:1.7;cursor:pointer;
    font-family:inherit;border-radius:3px;transition:.22s;position:relative;
    opacity:0;transform:translateY(8px);
  }
  .choice.show{opacity:1;transform:none}
  .choice::before{content:"◇";color:var(--gold);margin-right:12px;font-size:12px;opacity:.7}
  .choice:hover{background:rgba(216,196,135,.09);border-color:var(--gold);transform:translateX(6px)}
  .choice.secret{border-color:rgba(143,208,216,.5);background:rgba(143,208,216,.06)}
  .choice.secret::before{content:"✦";color:var(--cyan)}
  .choice.secret:hover{background:rgba(143,208,216,.12);border-color:var(--cyan)}

  /* ---------- 结局 ---------- */
  .end-tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-size:12.5px;letter-spacing:.3em;padding:5px 14px;border-radius:20px;margin-bottom:20px}
  .end-tag.secret{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 22px rgba(143,208,216,.25)}
  .end-tag.danger{border-color:var(--red);color:var(--red);box-shadow:0 0 22px rgba(255,80,70,.25)}
  .end-actions{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap}
  .end-actions button{
    flex:1;min-width:150px;background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:12px 0;cursor:pointer;font-family:inherit;letter-spacing:.3em;font-size:14px;border-radius:2px;transition:.22s;
  }
  .end-actions button:hover{color:var(--gold);border-color:var(--gold);background:rgba(216,196,135,.08)}
  .new-badge{color:var(--cyan);font-size:12.5px;letter-spacing:.25em;margin-left:10px;animation:blink 1.4s infinite}

  .float-gain{position:fixed;font-size:14px;letter-spacing:.15em;pointer-events:none;z-index:50;animation:floatUp 1.1s ease-out forwards;text-shadow:0 0 10px currentColor}
  @keyframes floatUp{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

  .audio-ctl{position:fixed;left:18px;bottom:14px;z-index:30;display:flex;gap:8px}
  .audio-ctl button{
    background:rgba(8,11,22,.6);border:1px solid var(--line);color:var(--ink-dim);
    font-family:inherit;font-size:12px;letter-spacing:.18em;padding:6px 13px;
    border-radius:2px;cursor:pointer;transition:.2s;
  }
  .audio-ctl button:hover{color:var(--gold);border-color:var(--gold)}
  .audio-ctl button.off{opacity:.4}

  /* ============ 演出层 ============ */
  #fx-canvas{position:fixed;inset:0;z-index:2;pointer-events:none}
  #scene-set{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    opacity:0;transition:opacity 1s ease;will-change:transform,opacity;
  }
  #scene-set.on{opacity:1}

  /* —— 序章 · 主神空间 —— */
  .core{
    position:absolute;left:50%;top:30%;width:230px;height:230px;transform:translate(-50%,-50%);
    border-radius:50%;border:2px dashed rgba(143,208,216,.32);
    box-shadow:0 0 60px rgba(143,208,216,.15),inset 0 0 60px rgba(143,208,216,.08);
    animation:spin 26s linear infinite,ringPulse 5s ease-in-out infinite;
  }
  .core-dot{position:absolute;left:50%;top:30%;width:14px;height:14px;transform:translate(-50%,-50%);
    border-radius:50%;background:rgba(143,208,216,.85);box-shadow:0 0 26px rgba(143,208,216,.8);
    animation:haloPulse 2.4s ease-in-out infinite}
  .punch{
    position:absolute;left:9%;bottom:44vh;width:158px;height:92px;
    background:linear-gradient(180deg,#141a2c,#0a0e1c);
    border:1px solid rgba(143,208,216,.3);border-radius:8px;
    box-shadow:0 0 30px rgba(80,200,220,.14);
  }
  .punch-time{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
    color:#74e2a8;font:17px "Consolas","Courier New",monospace;letter-spacing:.18em;
    text-shadow:0 0 12px rgba(116,226,168,.8)}
  .punch::before{
    content:"请 勿 迟 到";position:absolute;left:50%;top:84%;transform:translate(-50%,0);
    color:#5b574c;font-size:11px;letter-spacing:.3em;
  }

  /* —— 第一章 · 午夜凶铃 —— */
  .tv{
    position:absolute;left:50%;top:42%;width:min(560px,74vw);aspect-ratio:4/3;
    transform:translate(-50%,-48%);
    background:#07090f;border:16px solid #1d1712;border-radius:10px;
    box-shadow:0 26px 70px rgba(0,0,0,.7),0 0 90px rgba(150,190,255,.1);
  }
  .tv-screen{position:absolute;inset:0;overflow:hidden;border-radius:3px;
    background:radial-gradient(ellipse at 50% 42%,rgba(140,160,200,.18),rgba(40,50,85,.13) 55%,rgba(5,8,16,.92))}
  .tv-static{
    position:absolute;inset:-20%;
    background-image:radial-gradient(rgba(205,220,248,.5) 1px,transparent 1.5px);
    background-size:10px 10px;opacity:.09;
    animation:staticShift .26s steps(4) infinite;
  }
  @keyframes staticShift{
    0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
    50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,-2px)}
    100%{transform:translate(2px,3px)}
  }
  .tv-scan{position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(180,220,255,.05) 4px);
    animation:scanMove 5s linear infinite}
  @keyframes scanMove{to{transform:translateY(24px)}}
  .tv-well{
    position:absolute;left:50%;bottom:-4%;width:32%;height:86%;transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(212,226,246,.92),rgba(212,226,246,.5) 45%,transparent 92%);
    clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);filter:blur(.4px);
    animation:haloPulse 6s ease-in-out infinite;
  }
  .sil.ghost{left:calc(50% - 62px);width:124px;bottom:40vh;color:#dfe6f0;
    filter:drop-shadow(0 0 18px rgba(205,220,248,.55));animation:silIn 2s ease both,ghostFloat 7s ease-in-out 2s infinite}
  @keyframes ghostFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  /* —— 第二章 · 恐怖医院 —— */
  .hall-glow{position:absolute;inset:0;background:
    radial-gradient(600px 420px at 50% 8%,rgba(120,220,210,.10),transparent 65%),
    linear-gradient(180deg,rgba(20,60,64,.18),transparent 45%)}
  .hall{
    position:absolute;left:-20%;right:-20%;bottom:0;height:50vh;
    background:
      linear-gradient(92deg,transparent 0 49.8%,rgba(130,230,215,.10) 49.8% 50.2%,transparent 50.2% 100%),
      linear-gradient(88deg,transparent 0 49.8%,rgba(130,230,215,.10) 49.8% 50.2%,transparent 50.2% 100%),
      repeating-linear-gradient(180deg,transparent 0 74px,rgba(130,230,215,.10) 0 76px);
    -webkit-mask:linear-gradient(180deg,transparent,#000 26%);
    mask:linear-gradient(180deg,transparent,#000 26%);
    transform:perspective(420px) rotateX(46deg);transform-origin:50% 100%;
    animation:haloPulse 8s ease-in-out infinite;
  }
  .alert{position:absolute;top:9%;right:13%;width:16px;height:16px;border-radius:50%;
    background:#ff5a4e;box-shadow:0 0 20px #ff5a4e,0 0 50px rgba(255,90,78,.4);
    animation:alertBlink 1.1s steps(1) infinite}
  @keyframes alertBlink{0%,55%{opacity:1}56%,100%{opacity:.15}}
  .sil.nurse{right:9%;width:112px;bottom:42vh;color:#9fb4c4;
    filter:drop-shadow(0 0 16px rgba(150,200,205,.4));animation:silIn 2s ease both}
  .bed-sign{position:absolute;left:7%;top:24%;border:1px solid rgba(130,230,215,.3);
    color:rgba(150,220,210,.75);padding:8px 14px;font-size:13px;letter-spacing:.25em;
    box-shadow:0 0 22px rgba(130,230,215,.12);animation:haloPulse 4s ease-in-out infinite}

  /* —— 第三章 · 积分商城 —— */
  .sale-beam{
    position:absolute;left:-10%;top:-20%;width:52%;height:160%;

<script>
/* ================= 星空背景 ================= */
(function(){
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  let stars = [];
  function resize(){
    cv.width = innerWidth; cv.height = innerHeight;
    const n = Math.min(260, Math.floor(innerWidth*innerHeight/7000));
    stars = Array.from({length:n},()=>({
      x:Math.random()*cv.width, y:Math.random()*cv.height,
      r:Math.random()*1.3+.2, a:Math.random()*.7+.15,
      s:Math.random()*.012+.003, p:Math.random()*Math.PI*2
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const st of stars){
      const tw = st.a + Math.sin(t*st.s + st.p)*.25;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(220,228,255,'+Math.max(0,tw)+')';
      ctx.arc(st.x,st.y,st.r,0,7);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize); resize(); requestAnimationFrame(draw);
})();

/* ================= 音频引擎（Web Audio 程序化合成，无需外部文件） ================= */
const Sound=(function(){
  let ctx=null, bgmBus=null, sfxBus=null;
  let bgmOn=true, sfxOn=true, wantTrack=null, session=null, unlocked=false;
  try{
    const p=JSON.parse(localStorage.getItem('wuxian_audio_v1')||'{}');
    if(p.bgm===false) bgmOn=false;
    if(p.sfx===false) sfxOn=false;
  }catch(e){}

  const n2f = semi => 261.63*Math.pow(2,semi/12); // C4 起，半音偏移 → 频率
  let oscCount=0;
  function osc(){ oscCount++; return ctx.createOscillator(); }
  function dbg(){
    document.documentElement.dataset.audio=JSON.stringify({
      osc:oscCount, state:ctx?ctx.state:'none', track:wantTrack||null
    });
  }
  setInterval(dbg,800);

  function ensureCtx(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    ctx=new AC();
    const master=ctx.createGain(); master.gain.value=1; master.connect(ctx.destination);
    bgmBus=ctx.createGain(); bgmBus.gain.value=bgmOn?0.85:0; bgmBus.connect(master);
    sfxBus=ctx.createGain(); sfxBus.gain.value=sfxOn?0.9:0; sfxBus.connect(master);
  }
  function unlock(){
    ensureCtx();
    if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    if(!unlocked){ unlocked=true; if(wantTrack) playBgm(wantTrack); }
  }
  function persist(){
    let p={};
    try{ p=JSON.parse(localStorage.getItem('wuxian_audio_v1')||'{}')||{}; }catch(e){}
    p.bgm=bgmOn; p.sfx=sfxOn;
    localStorage.setItem('wuxian_audio_v1',JSON.stringify(p));
  }
  function ramp(p,v){ p.cancelScheduledValues(ctx.currentTime); p.setValueAtTime(p.value,ctx.currentTime); p.linearRampToValueAtTime(v,ctx.currentTime+.25); }

  /* ---- 合成元件：电子拨弦（方波+泛音） / 系统提示钟 / 打字敲击 ---- */
  function pluck(freq,t,peak,dur,dest){
    dest=dest||sfxBus;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(5200,freq*7);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const o1=osc(); o1.type='square'; o1.frequency.value=freq;
    const o2=osc(); o2.type='sine'; o2.frequency.value=freq*2;
    const g2=ctx.createGain(); g2.gain.value=.3;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(dest);
    o1.start(t);o2.start(t);o1.stop(t+dur+.06);o2.stop(t+dur+.06);
  }
  function bell(freq,t,peak,dur,dest){
    dest=dest||sfxBus;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    g.connect(dest);
    [[1,1],[2.01,.5],[2.99,.26],[4.18,.13]].forEach(([m,a])=>{
      const o=osc(); o.type='sine'; o.frequency.value=freq*m;
      const og=ctx.createGain(); og.gain.value=a;
      o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.06);
    });
  }
  function knock(){
    const t=ctx.currentTime;
    const o=osc(), g=ctx.createGain(), bp=ctx.createBiquadFilter();
    o.type='square';
    o.frequency.setValueAtTime(1100,t);
    o.frequency.exponentialRampToValueAtTime(660,t+0.03);
    bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=3.5;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.05,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(bp);bp.connect(g);g.connect(sfxBus);
    o.start(t);o.stop(t+.07);
  }

  /* ---- 音效 ---- */
  const sfxReady=()=>ctx && sfxOn;
  const sfx={
    type(){ if(sfxReady()) knock(); },
    hover(){ if(sfxReady()) pluck(n2f(16),ctx.currentTime,0.045,0.32); },
    click(){ if(sfxReady()) pluck(n2f(4),ctx.currentTime,0.07,0.28); },
    select(){
      if(!sfxReady()) return;
      pluck(n2f(7),ctx.currentTime,0.14,0.85);
      setTimeout(()=>{ if(sfxReady()) pluck(n2f(12),ctx.currentTime,0.1,0.85); },95);
    },
    turn(){ if(sfxReady()) bell(n2f(12),ctx.currentTime,0.055,1.9); },
    ending(){
      if(!sfxReady()) return;
      [12,16,19,24].forEach((s,i)=>setTimeout(()=>{ if(sfxReady()) pluck(n2f(s),ctx.currentTime,0.12,2.2); },i*330));
    },
    secret(){
      if(!sfxReady()) return;
      [7,12,16,19,24,28].forEach((s,i)=>setTimeout(()=>{ if(sfxReady()) bell(n2f(s),ctx.currentTime,0.085,2.6); },i*160));
    }
  };

  /* ---- 生成式 BGM：悬疑不协和音程 + 持续低音（社畜恐怖风） ---- */
  const TRACKS={
    title :{step:0.85,notes:[-4,0,1,5,6,12],every:4,prob:.4,dur:2.8,drone:[-12,-6],swell:28,bell:false},
    game  :{step:0.42,notes:[0,1,3,6,7,8,13],every:2,prob:.5,dur:1.2,drone:[-17,-12],swell:24,bell:false},
    ending:{step:0.7,notes:[0,4,7,12,16,19],every:3,prob:.55,dur:3.2,drone:[-12,-5],swell:24,bell:true}
  };

  function playBgm(name){
    wantTrack=name;
    if(!ctx) return;
    stopBgm();
    const cfg=TRACKS[name]||TRACKS.title, t0=ctx.currentTime+0.1;
    const trackGain=ctx.createGain();
    trackGain.gain.setValueAtTime(0.0001,ctx.currentTime);
    trackGain.gain.exponentialRampToValueAtTime(1,ctx.currentTime+2.4);
    trackGain.connect(bgmBus);

    const drones=cfg.drone.map(semi=>{
      const o=osc(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
      o.type='sine';o.frequency.value=n2f(semi);
      lp.type='lowpass';lp.frequency.value=650;
      g.gain.value=0.0001;
      o.connect(lp);lp.connect(g);g.connect(trackGain);o.start();
      return {o,g};
    });
    function swell(t){
      drones.forEach(d=>{
        d.g.gain.cancelScheduledValues(t);
        d.g.gain.setValueAtTime(Math.max(0.0001,d.g.gain.value),t);
        d.g.gain.exponentialRampToValueAtTime(0.05,t+cfg.step*4);
        d.g.gain.exponentialRampToValueAtTime(0.012,t+cfg.step*cfg.swell);
      });
    }
    swell(t0);
    let step=0,next=t0;
    const id=setInterval(()=>{
      if(ctx.state!=='running'){ next=ctx.currentTime+0.2; return; }
      while(next<ctx.currentTime+0.4){
        const t=next;
        if(step%cfg.every===0 && Math.random()<cfg.prob){
          const semi=cfg.notes[Math.floor(Math.random()*cfg.notes.length)];
          if(cfg.bell) bell(n2f(semi),t,0.05,cfg.dur,trackGain);
          else pluck(n2f(semi),t,0.065,cfg.dur,trackGain);
        }
        if(step%2===0 && Math.random()<0.16)
          pluck(n2f(cfg.drone[1]+(Math.random()<.5?0:2)),t,0.045,2.4,trackGain);
        if(step%cfg.swell===0) swell(t);
        next+=cfg.step;step++;
      }
    },150);
    session={id,trackGain,drones};
  }
  function stopBgm(){
    if(!session||!ctx) return;
    clearInterval(session.id);
    const s=session,t=ctx.currentTime,node=s.trackGain;
    s.drones.forEach(d=>{
      d.g.gain.cancelScheduledValues(t);
      d.g.gain.setValueAtTime(Math.max(0.0001,d.g.gain.value),t);
      d.g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
      d.o.stop(t+1.8);
    });
    s.trackGain.gain.cancelScheduledValues(t);
    s.trackGain.gain.setValueAtTime(Math.max(0.0001,s.trackGain.gain.value),t);
    s.trackGain.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
    setTimeout(()=>{ try{node.disconnect();}catch(e){} },2000);
    session=null;
  }

  function duck(go){
    if(!bgmBus||!ctx) return;
    ramp(bgmBus.gain, go&&bgmOn ? 0.3 : (bgmOn?0.85:0));
  }

  return {
    unlock, sfx, duck,
    bgm:playBgm,
    get bgmOn(){return bgmOn}, get sfxOn(){return sfxOn}, get unlocked(){return unlocked},
    toggleBgm(){ bgmOn=!bgmOn; persist(); if(bgmBus&&ctx) ramp(bgmBus.gain,bgmOn?0.85:0); return bgmOn; },
    toggleSfx(){ sfxOn=!sfxOn; persist(); if(sfxBus&&ctx) ramp(sfxBus.gain,sfxOn?0.9:0); return sfxOn; }
  };
})();

/* ================= 人物对话语音（Web Speech 合成，无外部资源） ================= */
const Voice=(function(){
  const synth=window.speechSynthesis||null;
  let on=true;
  try{
    const p=JSON.parse(localStorage.getItem('wuxian_audio_v1')||'{}');
    if(p.voice===false) on=false;
  }catch(e){}

  /* 角色音色：主神（客服甜音）/ 贞子（低沉）/ 王总（大叔）/ HR（冷厉）/ 玩家 / 旁白 */
  const PROFILES={
    narrator:{rate:.98,pitch:1.0, v:null},
    ai:      {rate:1.12,pitch:1.48,v:'f'},
    zhenzi:  {rate:.94, pitch:.62, v:'f'},
    boss:    {rate:1.05,pitch:.55, v:'m'},
    hr:      {rate:.96, pitch:.5,  v:'f'},
    player:  {rate:1.0, pitch:1.12,v:'f'}
  };
  let zh=[],vMale=null,vFemale=null;
  function pickVoices(){
    if(!synth) return;
    const all=synth.getVoices()||[];
    zh=all.filter(v=>/zh|cmn|Chinese/i.test(v.lang)||/Xiaoxiao|Yunjian|Huihui|Kangkang|Yaoyao/i.test(v.name));
    const find=re=>zh.find(v=>re.test(v.name))||all.find(v=>/zh/i.test(v.lang)&&re.test(v.name));
    vMale  =find(/Yunjian|Yunxi|Yunyang|Kangkang|Male|男/i);
    vFemale=find(/Xiaoxiao|Xiaoyi|Xiaomo|Xiaohan|Yaoyao|Huihui|Tingting|Female|女/i);
  }
  if(synth){ pickVoices(); synth.addEventListener&&synth.addEventListener('voiceschanged',pickVoices); }

  function persist(){
    let p={};
    try{ p=JSON.parse(localStorage.getItem('wuxian_audio_v1')||'{}')||{}; }catch(e){}
    p.voice=on;
    localStorage.setItem('wuxian_audio_v1',JSON.stringify(p));
  }

  function whoOf(w){
    if(/^(主神|小宇宙|系统|客服)$/.test(w)) return 'ai';
    if(/^(王总|王守一|老板)$/.test(w)) return 'boss';
    if(/^(贞子|周小唯|小周)$/.test(w)) return 'zhenzi';
    if(/^(护士|小张|甄主任|HR)$/.test(w)) return 'hr';
    return 'player';
  }
  function nearestKw(s){
    if(!s) return null;
    const verbs='说|问|道|吼|喊|笑|答|补充|喃喃|低声|重复|开口|吩咐|凑近|咳嗽|宣布|惊叫';
    const reV=new RegExp('(主神|小宇宙|系统|客服|王总|王守一|老板|贞子|周小唯|小周|护士|小张|甄主任|HR|你)[^，。；！？\\n”’]{0,10}?('+verbs+')','g');
    let m,last=null;
    while((m=reV.exec(s))) last=m[1];
    if(last) return whoOf(last);
    const kws=[
      [/主神|小宇宙|系统|客服/g,'ai'],
      [/王总|王守一|老板/g,'boss'],
      [/贞子|周小唯|小周/g,'zhenzi'],
      [/护士|小张|甄主任|HR/g,'hr'],
      [/你(?:喃喃|说|问|答|道|指)/g,'player']
    ];
    let best=null,bi=-1;
    for(const [r,w] of kws){
      r.lastIndex=0; let mm;
      while((mm=r.exec(s))){ if(mm.index>bi){ bi=mm.index; best=w; } }
    }
    return best;
  }
  function parse(text){
    const out=[];
    const re=/“([^”]*)”/g;
    let last=0,m,inherit='narrator';
    const push=(who,t)=>{ t=t.replace(/\s+/g,'').trim(); if(t) out.push({who,t}); };
    while((m=re.exec(text))){
      const pre=text.slice(last,m.index);
      if(pre) push('narrator',pre);
      const post=text.slice(re.lastIndex,re.lastIndex+14);
      const who=nearestKw(pre)||nearestKw(post)||inherit;
      inherit=who;
      push(who,m[1]);
      last=re.lastIndex;
    }
    if(last<text.length) push('narrator',text.slice(last));
    return out;
  }

  let token=0;
  function sayText(text){
    if(!synth) return;
    const my=++token;
    synth.cancel();
    if(!on) return;
    const segs=parse(text);
    let queued=0;
    segs.forEach((seg,i)=>{
      const u=new SpeechSynthesisUtterance(seg.t);
      const p=PROFILES[seg.who]||PROFILES.narrator;
      u.lang='zh-CN'; u.rate=p.rate; u.pitch=p.pitch;
      const v=p.v==='m'?vMale:p.v==='f'?vFemale:null;
      if(v) u.voice=v;
      const finish=()=>{ if(my===token && i===segs.length-1) Sound.duck(false); };
      u.onend=finish; u.onerror=finish;
      synth.speak(u); queued++;
    });
    if(queued){ try{synth.resume();}catch(e){} Sound.duck(true); }
  }
  function stop(){
    token++;
    if(synth) synth.cancel();
    Sound.duck(false);
  }
  function toggle(){
    on=!on; persist();
    if(!on){ stop(); }
    return on;
  }
  return {sayText,stop,toggle,get on(){return on},get supported(){return !!synth}};
})();

  let W=0,H=0,parts=[],streaks=[],mode='title';

      case 'end_loop': parts=dust('140,160,200',30,[.12,.3],[1,2],[.08,.28]); break;

        break;
      case 'die_punch': case 'die_tv': case 'die_walkout':
      case 'die_hospital_death': case 'die_hospital_charge': case 'die_hospital_ram': case 'die_hospital_gas':
      case 'die_mall_rob': case 'die_mall_tear': case 'die_final_quit': case 'die_final_zhongcai_fail': case 'die_hr_outtalk':
      case 'die_wire': case 'die_afk': case 'die_evidence':
        parts=dust('255,60,50',40,[-.5,-.15],[1,2.5],[.12,.45]);
        parts.push(...glyphs(12,[16,28],[.12,.32],'死'));
        break;
      default: parts=dust('200,215,235',26,[-.15,-.04],[1,2.2],[.1,.32]);
    }
  }

  function resetDust(p){
    if(p.vy<0){p.y=H+10;p.x=Math.random()*W;}
    else if(p.vy>0){p.y=-10;p.x=Math.random()*W;}
  }

  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.ph+=.02;
      p.x+=p.vx+Math.sin(p.ph)*.12;p.y+=p.vy;
      if(p.y<-16){p.y=H+14;p.x=Math.random()*W;}
      if(p.y>H+16){p.y=-14;p.x=Math.random()*W;}
      if(p.x<-14)p.x=W+10;if(p.x>W+14)p.x=-10;
      const a=Math.max(.02,Math.min(.9,p.a));
      if(p.glyph){
        ctx.font='500 '+p.s+'px '+FONT;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='rgba('+p.color+','+a+')';
        ctx.fillText(p.ch,p.x,p.y);
      }else{
        ctx.beginPath();
        ctx.fillStyle='rgba('+p.color+','+a+')';
        ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();
      }
    }
    for(const st of streaks){
      st.y+=st.vy;
      if(st.y-st.len>H+80){st.y=rand(-200,-60);st.x=rand(W*.3,W*.9);}
      const g=ctx.createLinearGradient(st.x,st.y-st.len,st.x,st.y);
      g.addColorStop(0,'rgba(143,208,216,0)');
      g.addColorStop(1,'rgba(160,225,240,'+st.a+')');
      ctx.strokeStyle=g;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(st.x,st.y-st.len);ctx.lineTo(st.x,st.y);ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  setMode('title'); requestAnimationFrame(frame);

  /* —— 场景切换（淡出演入）—— */
  const set=document.getElementById('scene-set');
  let swapTimer=null, clockTimer=null, clockT0=0;
  function tickClock(){
    const t=Date.now()-clockT0;
    const el=set.querySelector('.punch-time');
    if(el) el.textContent=String(Math.floor(t/3600000)).padStart(2,'0')+':'+
      String(Math.floor(t/60000)%60).padStart(2,'0')+':'+String(Math.floor(t/1000)%60).padStart(2,'0');
  }
  function startClock(){ clockT0=Date.now(); tickClock(); clockTimer=setInterval(tickClock,1000); }
  function stopClock(){ clearInterval(clockTimer); clockTimer=null; }
  function play(key){
    clearTimeout(swapTimer);
    set.classList.remove('on');
    swapTimer=setTimeout(()=>{
      set.innerHTML='<div class="scene-inner">'+(SCENES[key]||'')+'</div>';
      set.dataset.scene=key;
      document.body.dataset.scene=key;
      void set.offsetWidth;
      set.classList.add('on');
      if(key==='void') startClock(); else stopClock();
    },480);
  }
  function clear(){
    clearTimeout(swapTimer);
    stopClock();
    set.classList.remove('on');
    swapTimer=setTimeout(()=>{set.innerHTML='';document.body.removeAttribute('data-scene');},480);
  }

  return {setMode,play,clear};
})();

const SAVE_KEY='wuxian_save_v1', DONE_KEY='wuxian_endings_v1', CHECKPOINT_KEY='wuxian_checkpoints_v1';
let state = { node:'start', stats:{calm:0,talk:0,slacker:0}, flags:{contract:false,log:false} };
let typing=false, typeTimer=null;

function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; } }
function clearSave(){ localStorage.removeItem(SAVE_KEY); }
function getDone(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY))||[]; }catch(e){ return []; } }
function addDone(id){
  const d = getDone();
  const isNew = !d.includes(id);
  if(isNew){ d.push(id); localStorage.setItem(DONE_KEY, JSON.stringify(d)); }
  return isNew;
}

/* —— 存档点 —— */
const CHECKPOINTS=['tv','ch2_start','ch3_start','final_meeting'];
function getCheckpoints(){ try{ return JSON.parse(localStorage.getItem(CHECKPOINT_KEY))||[]; }catch(e){ return []; } }
function setCheckpoint(nodeId){
  const cps=getCheckpoints();
  if(!cps.includes(nodeId)){ cps.push(nodeId); localStorage.setItem(CHECKPOINT_KEY, JSON.stringify(cps)); }
}
function loadCheckpoint(){
  const cps=getCheckpoints();
  if(!cps.length) return null;
  // 找到进度最远的存档点
  let best=null;
  for(const cp of cps){
    if(!best || CHECKPOINTS.indexOf(cp)>CHECKPOINTS.indexOf(best)) best=cp;
  }
  return best;
}

function getAchvMeta(){
  try{ return JSON.parse(localStorage.getItem(ACHV_KEY))||{unlocked:[],deaths:0,runs:0,visited:{}}; }
  catch(e){ return {unlocked:[],deaths:0,runs:0,visited:{}}; }

let achvMeta = getAchvMeta();
const toastQueue=[];
let toastBusy=false;
function updateAchvCount(){
  $('achv-count').textContent = achvMeta.unlocked.length+'/'+ACHIEVEMENTS.length;
}
function unlockAchv(id){
  if(achvMeta.unlocked.includes(id)) return;
  achvMeta.unlocked.push(id);
  localStorage.setItem(ACHV_KEY, JSON.stringify(achvMeta));
  updateAchvCount();
  const a=ACHIEVEMENTS.find(x=>x.id===id);
  toastQueue.push(a);
  pumpToast();
}
function pumpToast(){
  if(toastBusy || !toastQueue.length) return;
  toastBusy=true;
  const a=toastQueue.shift();
  $('toast-name').textContent='「'+a.name+'」';
  const t=$('achv-toast');
  t.classList.add('show');
  try{ Sound.sfx.secret(); }catch(e){}
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>{toastBusy=false;pumpToast();},500); },2400);
}

  const s=state.stats;
  if((s.calm||0)>=5) unlockAchv('max_calm');
  if((s.talk||0)>=5) unlockAchv('max_talk');
  if((s.slacker||0)>=5) unlockAchv('max_slacker');
  if((s.calm||0)>=3&&(s.talk||0)>=3&&(s.slacker||0)>=3) unlockAchv('balanced');

    unlockAchv('first_death');
    if(achvMeta.deaths>=5) unlockAchv('deaths_5');
    if(ENDING_META.filter(m=>m.id.startsWith('die_')).every(m=>done.includes(m.id))) unlockAchv('all_deaths');
  }else{
    unlockAchv('first_clear');
    if(done.length>=ENDING_META.length) unlockAchv('all_end');
  }
}

/* ================= 界面逻辑 ================= */
const $ = id => document.getElementById(id);
const screens = {title:$('title-screen'), game:$('game-screen')};

function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
  const isEnding = name==='game' && STORY[state.node] && STORY[state.node].ending;
  Sound.bgm(name==='title' ? 'title' : (isEnding ? 'ending' : 'game'));
}

function renderDots(){
  const map=[['calm',$('dots-calm')],['talk',$('dots-talk')],['slacker',$('dots-slacker')]];
  for(const [k,el] of map){
    el.innerHTML='';
    for(let i=0;i<5;i++){
      const d=document.createElement('i');
      if(i<Math.min(5,state.stats[k]||0)) d.className='on';
      el.appendChild(d);
    }
  }
}

function floatGain(gain, anchor){
  if(!gain) return;
  const names={calm:['冷静','var(--cyan)'],talk:['嘴炮','var(--gold)'],slacker:['摸鱼','#c9a86a']};
  const r = anchor ? anchor.getBoundingClientRect() : {left:innerWidth/2,top:innerHeight/2};
  let i=0;
  for(const k in gain){
    for(let n=0;n<gain[k];n++){
      const el=document.createElement('div');
      el.className='float-gain';
      el.style.color=names[k][1];
      el.textContent='+'+names[k][0];
      el.style.left=(r.left+ (anchor? 200 : 0))+'px';
      el.style.top=(r.top+i*22)+'px';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1200);
      i++;
    }
  }
}

function renderNode(id){
  const node = STORY[id];
  if(!node){ console.error('剧情节点不存在: '+id); return; }
  state.node = id;
  save();
  if(!node.ending && CHECKPOINTS.includes(id)) setCheckpoint(id);
  if(node.ending) checkEndingAchv(id); else checkNodeAchv(id);
  $('hud-chapter').textContent = node.chapter;
  $('node-chapter').textContent = node.chapter;
  $('node-title').textContent = node.title;
  $('choices').innerHTML='';
  $('continue-hint').textContent='';
  renderDots();

  /* —— 演出层：场景、粒子、章节过场、面板入场 —— */
  const sceneKey = node.ending ? id : sceneKeyFor(id);
  Stage.setMode(sceneKey);
  Stage.play(sceneKey);
  $('hud-scene').textContent = node.ending ? '全剧终' : (SCENE_NAMES[sceneKey]||'主神空间');
  if(node.chapter!==lastChapter){ showVeil(node.chapter); lastChapter=node.chapter; }
  const paperEl=document.querySelector('.paper');
  paperEl.classList.remove('enter'); void paperEl.offsetWidth; paperEl.classList.add('enter');
  $('story-scroll').scrollTop=0;
  $('story-footer').scrollTop=0;

  if(node.ending){
    Sound.bgm('ending');
    Sound.sfx[node.secret?'secret':'ending']();
  }else{
    Sound.sfx.turn();
  }

  const tagEl = document.querySelector('.end-tag'); if(tagEl) tagEl.remove();
  const actEl = document.querySelector('.end-actions'); if(actEl) actEl.remove();
  const newBadge = document.querySelector('.new-badge'); if(newBadge) newBadge.remove();

  if(node.ending){
    const isNew = addDone(id);
    const tag=document.createElement('div');
    tag.className='end-tag'+(node.secret?' secret':'')+(id.startsWith('die_')?' danger':'');
    tag.textContent = node.tag;
    if(isNew){ const b=document.createElement('span'); b.className='new-badge'; b.textContent='◆ 已收入回廊'; tag.appendChild(b); }
    $('node-title').before(tag);
  }

  Voice.sayText(node.text);
  typewrite(node.text, ()=>{
    if(node.ending){
      const actions=document.createElement('div');
      actions.className='end-actions';
      const cp=loadCheckpoint();
      const btnLabel = id.startsWith('die_') && cp ? '从存档点复活' : '再上一天班';
      actions.innerHTML='<button id="ea-again">'+btnLabel+'</button><button id="ea-title">回到标题</button>';
      $('choices').appendChild(actions);
      $('ea-again').onclick=()=>{
        if(id.startsWith('die_') && cp){ respawnAtCheckpoint(); }
        else{ startGame(); }
      };
      $('ea-title').onclick=()=>toTitle();
    }else{
      const choices = node.choices.filter(c=>!c.requires || c.requires(state));
      const box=$('choices');
      choices.forEach((c,idx)=>{
        const b=document.createElement('button');
        b.className='choice'+(c.secret?' secret':'');
        b.textContent=c.t;
        b.addEventListener('mouseenter',()=>Sound.sfx.hover());
        b.onclick=(e)=>{
          Sound.sfx.select();
          // 先用选择前的属性判定是否触发死亡，再应用属性变化
          const willDie = c.deadlyIf && c.deadlyIf(state);
          if(c.gain) for(const k in c.gain){ state.stats[k]+=c.gain[k]; floatGain(c.gain,b); }
          if(c.setFlag){ state.flags[c.setFlag]=true; }
          renderDots();
          checkStatsAchv();
          b.classList.add('picked');
          const dest = willDie ? (c.deadlyTo||c.to) : c.to;
          setTimeout(()=>renderNode(dest),260);
        };
        box.appendChild(b);
        setTimeout(()=>b.classList.add('show'), 180*idx+120);
      });
    }
  });
}

function typewrite(text, done){
  typing=true;
  const el=$('node-text');
  const scrollEl=$('story-scroll');
  const updateText=(value)=>{
    const follow=scrollEl.scrollHeight-scrollEl.scrollTop-scrollEl.clientHeight<32;
    typed.textContent=value;
    if(follow) scrollEl.scrollTop=scrollEl.scrollHeight;
  };
  el.innerHTML='<span class="typed"></span><span class="cursor"></span>';
  const typed=el.querySelector('.typed');
  const cursor=el.querySelector('.cursor');
  let i=0;
  let lastTick=0;
  clearInterval(typeTimer);
  const step=()=>{
    updateText(text.slice(0,++i));
    const now=performance.now();
    if(now-lastTick>150){ lastTick=now; Sound.sfx.type(); }
    if(i>=text.length){ finish(); return; }
  };
  typeTimer=setInterval(step,24);
  function finish(){
    clearInterval(typeTimer);
    updateText(text);
    cursor.remove();
    typing=false;
    $('continue-hint').textContent = STORY[state.node].ending ? '— 全 终 —' : '请 抉 择';
    done&&done();
  }
  el.parentElement.onclick=(e)=>{
    if(typing){
      clearInterval(typeTimer);
      updateText(text);
      cursor.remove();
      typing=false;
      $('continue-hint').textContent = STORY[state.node].ending ? '— 全 终 —' : '请 抉 择';
      done&&done();
    }
  };
}

/* ================= 场景映射 / 章节过场 / 标题 ================= */
const SCENE_NAMES={void:'主神空间',tv:'午夜凶铃 · 老屋',hospital:'恐怖医院',mall:'积分商城',meeting:'项目复盘会'};
let lastChapter=null;
const SETS={
  void:new Set(['start','rule','loop_gag','company','draw','skill_talk','void_walk','dagua','company2','mission','die_punch','die_afk','die_wire']),
  tv:new Set(['tv','unplug','offer','hurry','first_talk','task_list','resume','weekly','company3','hr_prep','hr_observe','hr_fight','hr_retort','hr_contract','boss_defeat','after_boss','die_tv','die_walkout','die_hr_outtalk','die_wire']),
  hospital:new Set(['ch2_start','gag_nurse','ward','basement','cashier','die_gag','yibao','escape','locker','payroll','doubt','die_hospital_death','die_hospital_charge','die_hospital_ram','die_hospital_gas']),
  mall:new Set(['ch3_start','mall_buy','mall_vip','mall_complain','ch3_main','fine','truth','truth_direct','truth2','truth3','die_mall_rob','die_mall_tear']),
  meeting:new Set(['final_meeting','offer_d','counter','counter2','final_choices','die_final_quit','die_final_zhongcai_fail','die_evidence'])
};
function sceneKeyFor(id){
  for(const k in SETS){ if(SETS[k].has(id)) return k; }
  return 'void';
}
let veilTimer=null;
function showVeil(chapter){
  const parts=chapter.split(' · ');
  $('chapter-veil').querySelector('.veil-inner').innerHTML=
    '<div class="veil-c">'+parts[0]+'</div>'+
    '<div class="veil-line"></div>'+
    (parts[1]?'<div class="veil-s">'+parts[1]+'</div>':'');
  const veil=$('chapter-veil');
  void veil.offsetWidth;
  veil.classList.add('show');
  clearTimeout(veilTimer);
  veilTimer=setTimeout(()=>veil.classList.remove('show'),2000);
}
/* 鼠标视差：远景轻微跟随 */
addEventListener('mousemove',e=>{
  if(e.pointerType==='touch') return;
  const x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5;
  const set=$('scene-set');
  set.style.transform='translate('+(x*-16)+'px,'+(y*-10)+'px)';
  document.querySelector('.nebula').style.transform='translate('+(x*-26)+'px,'+(y*-16)+'px)';
});

function startGame(){
  lastChapter=null;
  state={node:'start',stats:{calm:0,talk:0,slacker:0},flags:{contract:false,log:false}};
  save();
  achvMeta.runs++;
  localStorage.setItem(ACHV_KEY, JSON.stringify(achvMeta));
  unlockAchv('first_day');
  if(achvMeta.runs>=10) unlockAchv('overtime_10');
  showScreen('game');
  renderNode('start');
}
function continueGame(){
  const s=loadSave();
  if(!s) return;
  state=s;
  if(!state.flags) state.flags={contract:false,log:false};
  showScreen('game');
  renderNode(state.node);
}
function respawnAtCheckpoint(){
  const cp=loadCheckpoint();
  if(!cp) return startGame();
  state.node=cp;
  save();
  showScreen('game');
  renderNode(cp);
}
function toTitle(){
  clearInterval(typeTimer);
  Voice.stop();
  lastChapter=null;
  Stage.setMode('title');
  Stage.clear();
  showScreen('title');
  refreshTitle();
}
function refreshTitle(){
  $('btn-continue').disabled = !loadSave();
  const cp=loadCheckpoint();
  const btn=$('btn-respawn');
  if(cp){ btn.disabled=false; btn.style.display='inline-block'; }
  else{ btn.disabled=true; btn.style.display='none'; }
}

$('btn-start').onclick=startGame;
$('btn-continue').onclick=continueGame;
$('btn-respawn').onclick=respawnAtCheckpoint;
$('btn-title').onclick=toTitle;

$('btn-gallery').onclick=()=>{
  const done=getDone();
  const list=$('gallery-list');
  list.innerHTML='';
  ENDING_META.forEach(m=>{
    const got=done.includes(m.id);
    const div=document.createElement('div');
    div.className='ending-card'+(got?'':' locked');
    div.innerHTML = got
      ? '<div class="et">'+m.name+'</div><div class="ed">'+m.desc+'</div>'
      : '<div class="et">？？？</div><div class="ed">此结局尚未抵达。或许，你需要更冷静，或是留意那些盖了章的小纸片。</div>';
    list.appendChild(div);
  });
  $('gallery').classList.add('show');
};
$('gallery-close').onclick=()=>$('gallery').classList.remove('show');
$('gallery').onclick=e=>{ if(e.target.id==='gallery') $('gallery').classList.remove('show'); };

/* —— 成就殿堂 —— */
$('btn-achv').onclick=()=>{
  const list=$('achv-list');
  list.innerHTML='';
  ACHIEVEMENTS.forEach(a=>{
    const got=achvMeta.unlocked.includes(a.id);
    const div=document.createElement('div');
    div.className='ending-card'+(got?' achv-done':' locked');
    div.innerHTML = got
      ? '<div class="et">◆ '+a.name+'</div><div class="ed">'+a.desc+'</div>'
      : '<div class="et">'+(a.hidden?'？？？':'☆ 未解锁')+'</div><div class="ed">'+(a.hidden?'隐藏成就。继续上班，答案藏在副本里。':a.desc)+'</div>';
    list.appendChild(div);
  });
  $('achv').classList.add('show');
};
$('achv-close').onclick=()=>$('achv').classList.remove('show');
$('achv').onclick=e=>{ if(e.target.id==='achv') $('achv').classList.remove('show'); };

/* ================= 音频：手势解锁 / 开关 / 通用按钮音 ================= */
function firstGesture(){
  if(!Sound.unlocked && document.querySelector('.screen.active').id==='title-screen') Sound.bgm('title');
  Sound.unlock();
}
['pointerdown','click','keydown','touchstart'].forEach(ev=>
  document.addEventListener(ev,firstGesture,true));
function syncAudioBtns(){
  const b=$('btn-bgm'), s=$('btn-sfx'), v=$('btn-voice');
  b.textContent='乐 · '+(Sound.bgmOn?'开':'关');
  b.classList.toggle('off',!Sound.bgmOn);
  s.textContent='音 · '+(Sound.sfxOn?'开':'关');
  s.classList.toggle('off',!Sound.sfxOn);
  v.textContent='声 · '+(Voice.on?'开':'关');
  v.classList.toggle('off',!Voice.on);
  v.style.display=Voice.supported?'':'none';
}
$('btn-bgm').onclick=()=>{ Sound.toggleBgm(); syncAudioBtns(); };
$('btn-sfx').onclick=()=>{ Sound.toggleSfx(); syncAudioBtns(); };
$('btn-voice').onclick=()=>{
  const on=Voice.toggle();
  syncAudioBtns();
  if(on && screens.game.classList.contains('active') && STORY[state.node]) Voice.sayText(STORY[state.node].text);
};
document.addEventListener('click',e=>{
  const btn=e.target.closest('button');
  if(!btn) return;
  if(btn.classList.contains('choice')) return;
  if(btn.closest('.audio-ctl')) return;
  Sound.sfx.click();
});
syncAudioBtns();

updateAchvCount();
refreshTitle();
</script>
